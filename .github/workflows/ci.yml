name: CI
on:
  push:
    branches-ignore: [main]
    tags: ["**"]
  pull_request:
  workflow_call:
    inputs:
      upload_pages:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:private
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e:factory
      - run: npm run e2e:factory
        env:
          PLAYWRIGHT_FACTORY_BROWSER: webkit
      - name: Package and start the private worker
        run: |
          node scripts/package-worker.mjs "$RUNNER_TEMP/knowledge-podcast-worker.tar.gz"
          node scripts/verify-worker.mjs "$RUNNER_TEMP/knowledge-podcast-worker.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.upload_pages
        with:
          name: knowledge-podcast-worker
          path: ${{ runner.temp }}/knowledge-podcast-worker.tar.gz
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: inputs.upload_pages
        with:
          path: dist
